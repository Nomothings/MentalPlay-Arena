[project]
name = "mentalplay-arena"
version = "0.1.0"
description = "MentalPlay-Arena: quantitative LLM role-play evaluation via psychiatric interview reenactment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "deep-translator>=1.11.4",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.26.0",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.27.0",
    "uvicorn>=0.52.0",
]

[project.optional-dependencies]
translate = ["deep-translator>=1.11.4"]

[project.scripts]
mentalplay-arena = "mentalplay_arena.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call real LLM APIs (run with RUN_LIVE=1)",
]
addopts = "-q"

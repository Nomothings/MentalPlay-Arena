# K-SADS Module Configuration

# Scoring Configuration
scoring:
  # Special condition category_id list (for special rule judgment)
  special_categories: [1, 2, 3, 9, 10, 11, 12, 13]
  # Default jump question_id (when special conditions are met)
  special_jump_question: "16_1"

# Logging Configuration (module-specific)
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./logs/ksads.log"
  console: true

# Answer Configuration
answers:
  # Answer save format
  format: "json"  # Options: json, csv, excel
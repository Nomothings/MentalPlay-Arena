# AUDIT Module Configuration

# Scoring Configuration
scoring:
  # AUDIT uses a simple summation scoring system
  method: "summation"

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./logs/audit.log"
  console: true

# Answer Configuration
answers:
  # Answer save format
  format: "json"  # Options: json, csv, excel
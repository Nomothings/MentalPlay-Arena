# EDE-Q Module Configuration

# Scoring Configuration
scoring:
  # EDE-Q uses a simple summation scoring system
  method: "summation"

# Logging Configuration (module-specific)
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./logs/edeq.log"
  console: true

# Answer Configuration
answers:
  # Answer save format
  format: "json"  # Options: json, csv, excel
